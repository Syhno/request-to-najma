<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Najju ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      color: #333;
      overflow: hidden;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 320px;
      position: relative;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      position: relative;
    }
    .yes { background: #4CAF50; color: white; }
    .no { background: #f44336; color: white; position: absolute; }
    .lock-btn { background: #2196F3; color: white; }
    input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    img {
      width: 150px;
      border-radius: 15px;
      margin-top: 15px;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="page1">
  <h2>🔒 Enter Password</h2>
  <input type="password" id="password" placeholder="Enter password">
  <br>
  <button class="lock-btn" onclick="checkPassword()">Unlock</button>
</div>

<div class="container" id="page2" style="display:none;">
  <h2>Hey Najju 💖</h2>
  <p>Will you come with me tomorrow to the party?<br>(I'll pick and drop you 😊)</p>
  <button class="yes" onclick="yesClicked()">Yes 💕</button>
  <button class="no" id="noBtn" onmouseover="moveNo()">No 😒</button>
</div>

<div class="container" id="page3" style="display:none;">
  <h2>Thank youuu so much!!! 😍</h2>
  <p>Can't wait for tomorrow 💕</p>
  <img src="your-photo.jpg" alt="My Photo">
</div>

<script>
  function checkPassword() {
    const pass = document.getElementById('password').value;
    if(pass === '2705') {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';
    } else {
      alert('Wrong password 😤');
    }
  }

  function yesClicked() {
    document.getElementById('page2').style.display = 'none';
    document.getElementById('page3').style.display = 'block';
  }

  function moveNo() {
    const btn = document.getElementById('noBtn');
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;
    btn.style.transform = `translate(${x}px, ${y}px)`;
  }

  // hearts animation
  setInterval(() => {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
</script>

</body>
</html>
